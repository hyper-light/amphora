# lane constants
# Picked constants replaced by derived ones (Ada, 2026-11-11: "learned and stat derived values only"; kiln goal
# dfabffcc). FD.n: the process's descriptor budget (local-owner-transport.md, "Decision (lane constants): one
# descriptor budget").

[[own]]
id = "FD.1"
title = "One descriptor budget a process: connections bounded by the system's descriptor limit, not a picked 32"
criteria = [
  { id = "AC-FD.1.1", text = "No count of connections: each accepted connection charges its socket to the process's descriptor budget (the soft RLIMIT_NOFILE as it stands, read at every charge, less the descriptors open outside the budget, counted again when the limit moves, a charge would be refused or the system refuses one; 2^24 handles on Windows), and one past it is closed unserved with a typed refusal at the client" },
  { id = "AC-FD.1.2", text = "The listener's backlog is the system's own most (SOMAXCONN semantics), and the listener goes on when the system refuses a descriptor (EMFILE, ENFILE, WSAEMFILE)" },
  { id = "AC-FD.1.3", text = "A replica's local readers out at once are at most the budget's bound (AC-T1.10.L2)" },
  # lane constants (2026-11-21): OWNERS_MAX's 4,096 replaced
  { id = "AC-FD.1.4", text = "No count of owners: each owner charges one descriptor to the process's budget before any probe or lease (a local or replicated owner's lease, a client's socket), held where that file is held and given back once it closes; past the budget an open or attach is refused TooLarge and makes nothing; the drained paths kept are at most the budget's bound" },
]
tests = [
  { id = "T-FD.1.1", text = "A budget of 3 asked for one, two, then one more — passes when the fourth is refused TooLarge naming what it was for, 4 past 3, and two more are held once two are given back" },
  { id = "T-FD.1.2", text = "The process's budget on Unix, its soft RLIMIT_NOFILE raised by one while it runs and put back — passes when it has room under the limit by stdin, stdout and stderr at least, and its limit follows the raise and the return at its next charge" },
  { id = "T-FD.1.3", text = "A budget of 1, an owner, one client served and kept, a second asked, the first let go, a third asked — passes when the second is turned away before any challenge and the third is served" },
  # lane constants (2026-11-21)
  { id = "T-FD.1.4", text = "A budget of 1, one database opened, a second opened, the first dropped and drained, the second opened again — passes when the first holds 1, the second is refused TooLarge at 1, then served" },
]

[[own]]
id = "DQ.1"
title = "The replicated owner drives once a step, taking turns with its inputs, not a picked 32 drives"
criteria = [
  { id = "AC-DQ.1.1", text = "One drive a step, and a step whose drive left more comes again at once without waiting for an input: deficit round robin of inputs and drives, one unit each (Shreedhar and Varghese 1995, Theorem 4.5)" },
]
tests = [
  { id = "T-DQ.1.1", text = "Three members, an election and 20 writes on driven time — passes when every write is answered and some step left more to drive for the next" },
]

[[own]]
id = "TP.1"
title = "The replicated owner's tick period learned where it runs, not a picked 10 ms"
criteria = [
  { id = "AC-TP.1.1", text = "Each voter's round trips are measured from the owner's own heartbeats', pre-votes' and votes' sends and answers, a request timed only once every earlier one to its peer is answered (Karn's rule), with RFC 9002's smoothed estimator; the log's flushes, the leader's link's arrival lateness and the owner's timer lateness are folded beside them" },
  { id = "AC-TP.1.2", text = "Once an election timeout the period is derived by hyper-timing's law (Ballot, election span, arrival detector, ElectionTiming, TickPace) and the owner ticks, sets its write slot's bounds and its leases at it; before a quorum, the timer and the link are measured it is hyper-timing's start state (TickPace::floor) at the period the owner opened with" },
]
tests = [
  { id = "T-TP.1.1", text = "Requests sent and answered in order, behind unanswered ones, and past the core's count for a lost peer — passes when only an unambiguous request's answer is sampled, at its own round trip" },
  { id = "T-TP.1.2", text = "A pace fed nothing, then a quorum and the timer, then a near and a far group's heartbeats — passes when it is the start state until the link is measured, then covers the measured election, the far group's period longer than the near one's and neither the start period" },
  { id = "T-TP.1.3", text = "The driven election, patience and lease tests — passes when each reads its owner's pace and none assumes 10 ms" },
]

[[own]]
id = "CT.1"
title = "The raft log's compaction due at an expansion learned where it runs, not a picked 128 MiB"
criteria = [
  { id = "AC-CT.1.1", text = "The replicated machine reports its image's bytes, so hyper-durable's compaction_due (Ongaro's thesis §5.1.2) weighs the log against the image it opened with, then the image it last made" },
  { id = "AC-CT.1.2", text = "The owner times each image and each drive that applied entries on its own clock, per byte, with RFC 6298's decaying sums; the expansion is the image's cost over the replay's, raised to a whole factor (ski rental's break-even), one before both are measured; a stall compacts at once" },
]
tests = [
  { id = "T-CT.1.1", text = "Nothing measured, one cost, samples of no time — passes when the factor is one" },
  { id = "T-CT.1.2", text = "Images four times dearer a byte than replay, a third as dear, then dearer — passes when the factor is four, one, then follows the images up" },
  { id = "T-CT.1.3", text = "A large and a tiny sample — passes when each weighs by its bytes" },
  { id = "T-CT.1.4", text = "The driven compaction tests of database::replicated — passes when each compacts by the learned rule" },
]

[[own]]
id = "EN.1"
title = "A replicated command's and an image's envelope is what their encoding adds, not a picked mebibyte"
criteria = [
  { id = "AC-EN.1.1", text = "The bound past a command's or an image's page budget is postcard's most for its baseline prefix and declaration, its base, its page list's length and each page's id and length at the one page size admitted" },
