  { id = "AC-PL.4.2", text = "q06's lineitem is within 2 of its count (off by 1.9e+03), and JOB's first-table q-error p95 under 20 (1.342e+04)" },
  { id = "AC-PL.4.3", text = "JOB's median planning time is at most twice step 3's 1.9 ms" },
]
tests = [
  { id = "T-PL.4.1", text = "A filter made more restrictive by one conjunct — passes when its estimate never rises (CERT), with and without a sample" },
