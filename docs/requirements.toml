title = "Follower reads at a closed time, and search over partitions asked at once (G13 step 4; CP-T1.10)"
criteria = [
  { id = "AC-T1.10.C1", text = "Every entry an owner proposes carries its proposer's clock; every member applies it at the larger of that stamp and one microsecond past the time before it, recorded in the entry's own transaction: times rise strictly along the committed log whoever leads and whatever their clocks say" },
  { id = "AC-T1.10.C2", text = "A follower read (Database::query_closed) answers at its replica's closed time, once that is at least the time it asked: the state it read is its group's at that time, every write at it or before and none after; it waits on its caller's thread until its deadline, refused Timeout past it, and Fenced once the owner ended" },
  { id = "AC-T1.10.C3", text = "The time a follower read can ask without waiting (Database::follower_read_micros) is now less the lag the replica measured at runtime: the nearest-rank p99 of how far its closed time stood behind its clock over its last 100 moves (1 / (1 - 0.99), AC-T1.10.3's quantile), refused before it measured any" },
  { id = "AC-T1.10.S1", text = "A search asks every partition at once, one thread each, and merges their answers newest first to its limit (amphora::search)" },
]
tests = [
