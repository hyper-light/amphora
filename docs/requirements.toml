# lane colcopy-4 (with colcopy-bound to colcopy-3): column copies within a fixed memory limit
# (kiln goal c436eeb51c2c891ea1208618a490677f; columnar.md decision 2).
[[own]]
id = "CB"
title = "Column copies granted their memory before they are built; a refused copy bought again by a switch, measured A against B"
criteria = [
  { id = "AC-CB.1.1", text = "Each block's bytes are asked of the memory source, sized from its format, before it is built, and each change's before it is applied: a copy never holds a byte it was not granted" },
  { id = "AC-CB.1.2", text = "A build refused part way gives back every byte it took and leaves the copy as it was" },
  { id = "AC-CB.2.1", text = "Both rebuy ways behind one switch (AMPHORA_COLUMN_REBUY): A rents and buys again; B waits for room" },
  { id = "AC-CB.2.2", text = "Under B a refused copy is not bought again, nor its table read whole, until the source reports room for its expected size, re-estimated as its table grows" },
  { id = "AC-CB.3.1", text = "Counted: state changes with reasons, takes asked, granted and refused, bytes held against bytes granted, rows and bytes rebuys read, rows the copy served against the row loop's" },
  { id = "AC-CB.3.2", text = "Counted: time copies were absent and time they waited" },
  { id = "AC-CB.4.1", text = "An A/B harness forces each way's failure mode at the extremes and records latency percentiles, throughput, memory, bytes read, rebuys and answer equality as JSONL" },
  # lane colcopy-5
  { id = "AC-CB.4.2", text = "One driver runs the six scenarios on Amphora under each way and on DuckDB, both in process, in memory, timed alike, under the same cap (the engine's bytes for its rows and the scenario's free bytes); each record names its client and platform" },
  # lane colcopy-7
