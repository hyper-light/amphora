  # lane scaleout-harness-9
  { id = "T-SH.3", text = "pgtext::tests::scaleout_harness_9_postgres_client_gives_up_at_its_deadline — passes when a server that never answers is given up at the client's deadline, as a typed error, not a hang" },
  { id = "T-SH.4", text = "pgtext::tests::scaleout_harness_9_postgres_messages_decode — passes when a DataRow's text and NULL columns and an ErrorResponse's fields decode, and a cut-short row is refused" },
