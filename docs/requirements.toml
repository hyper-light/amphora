  { id = "T-PL.13.8", text = "An uncorrelated FROM-clause subquery stored in the seek index its lookups read counts its entries once filled, against the rows the plan read for it; past the estimate's error the count is stored for the planner and the statement is planned again, once; the answer is the same with adaptive joins on and off" },
  { id = "T-PL.13.9", text = "A GROUP BY subquery whose estimate ANALYZE's group count set is checked against that count's error (the stored average's rounding and the statistics' error, in quadrature), not its rows': a count within it is not planned again, one past it is, once; the answer is the same with adaptive joins on and off" },
  # lane replan-9
  { id = "T-PL.13.10", text = "A hash join's build filtered by one = or IN list whose share ANALYZE's column statistics gave, not the sample, counts the share of its table it keeps against that share; past its error (the sample's binomial one at the share planned on) the counted share is stored for the planner and the statement is planned again, once; the answer is the same with adaptive joins on and off" },
  { id = "T-PL.13.11", text = "An ORDER BY sorter fed by an index seek on one table counts its input once all in, against the share the plan read for every WHERE term, the seek's among them; for one = or IN list the column statistics estimate, past its error the counted share is stored and the statement is planned again, once; the answer, in order, is the same with adaptive joins on and off" },
  # lane replan-10
  { id = "T-PL.13.12", text = "An uncorrelated IN subquery's ephemeral index counts its distinct values once filled, against the values the plan read for it, keyed by the subquery's identity; past the estimate's error the count is stored for the planner and the statement is planned again, once; the answer is the same with adaptive joins on and off" },
  { id = "T-PL.13.13", text = "An uncorrelated IN subquery's values are estimated from statistics: at most its rows, at most its column's distinct values where ANALYZE counted them, and at most the distinct values of the column it is tested against (the containment assumption), the share kept that many of that column's distinct values; no cap at the square root of the table's rows" },
  { id = "T-PL.13.14", text = "A GROUP BY's sorter that takes every row read, fed by one table's full scan or index seek, counts its input once all in, ahead of its sort, against the table's rows or its WHERE terms' share of them; past the estimate's error the count or share is corrected and the statement is planned again, once; the answer is the same with adaptive joins on and off" },
