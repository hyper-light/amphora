  { id = "AC-G8.1.2", text = "the three validations' throughput, refusal rates and p99 on the suite's write classes and K0 at 32 writers recorded (amphora-bench --cc)" },
]
tests = [
  { id = "T-G8.1.1", text = "Elle list-append and rw-register histories, 10,000 seeds — passes when no G0, G1a, G1b, G1c, G-single or G2" },
  { id = "T-G8.1.2", text = "Each validation on hand-made schedules (write skew, a phantom closing a cycle, a lone antidependency, the read-only anomaly, an open writer of a row read) — passes when each refuses exactly what its scheme says" },
]

# lane g8-gc
# Amphora's own IDs for G8 step 2 (kiln plan 01a16b0f4716761cb68dc0c96863b53b, step 2, under
# CP-T1.3): versions collected, memory bounded, typed refusals.
[[own]]
id = "G8.2"
title = "Versions collected, memory bounded, robust out of memory (G8 step 2)"
criteria = [
  { id = "AC-G8.2.1", text = "a reader held open an hour under 32 writers keeps the versioned storage's memory within its budget, refusing typed (MemoryBudget) past it, and its answers stay its snapshot's" },
]
tests = [
  { id = "T-G8.2.1", text = "Soak: one long snapshot, 32 writers, a collector (AMPHORA_G8_SOAK_SECONDS for the hour) — passes when the budget never holds past its limit, every refusal is typed, every scan is the snapshot's, each row keeps at most one older version once collected, and every byte comes back" },
  { id = "T-G8.2.2", text = "Commits kept for validation only while a transaction begun before them is open, not for a read-only snapshot" },
  { id = "T-G8.2.3", text = "A transaction's reads past the budget escalate to its whole tree, and its commit is refused at least where the finer record would be" },
]

# lane split-merge: groups that split, merge and move themselves (kiln goal 49477403, G13 step 2;
# docs/design/reshard.md). Criteria are CP-T1.9's AC-T1.9.1 to AC-T1.9.3.
[[own]]
id = "RS.1"
title = "Split, merge and move as one fenced hand-off: copy, catch-up in rounds, a brief cutover, decided by measured share"
criteria = [
  { id = "AC-RS.1.1", text = "Every position in exactly one group's span after every directory change; a change that would break it refused whole" },
  { id = "AC-RS.1.2", text = "Split past one core's share of load or bytes, merge at half a core's share together, move only without overshoot: every value measured as it runs or the split's own factor of two" },
]
tests = [
  { id = "T-T1.9.S1", text = "Automatic splits, merges and moves in the simulator under writes, driver and group restarts and lost logs — passes when every key is in exactly one group, the directory's, and writes lost is 0" },
  { id = "T-T1.9.R1", text = "A split carried through the directory group's replicated log while groups route by it — passes when every member holds the same directory, a write to the fenced range is refused typed, a router on the old directory is refused by the old group's holding after the flip, and once routed by the new directory the range is written to and read from the new group" },
  { id = "T-T1.9.R2", text = "A refused directory change and a directory image — passes when the refusal is alike on every member and changes nothing, an image installs the same directory and a member reopened opens at the image it kept, and an image that doesn't decode, installed or kept, is refused" },
  # lane split-merge-5
  { id = "T-T1.9.R3", text = "A group's holding kept by its own database with its rows: a key fenced, then the groups started again on the same files — passes when the fenced key is still refused, typed, and the group's other keys are still taken" },
  # lane split-merge-6
  { id = "T-T1.9.R4", text = "A group with rows split by the driver through the shell (Groups::carry) while writes go on, then merged back — passes when the moving range's rows, those there before and those written during the copy and catch-up, are in the new group, every acknowledged write is read back from exactly one group, and after the merge the retired group is gone with every row in the one left" },
  { id = "T-T1.9.R5", text = "The split and merge of T-T1.9.R4 with every action carried twice at the real groups, stale actions carried late and the driver restarted from the durable directory at the third action, the sixth, the twelfth and so on — passes when each operation still ends flipped, every acknowledged write is read back from exactly one group, and the one group left holds every row" },
  { id = "T-T1.9.P1", text = "The cutover-pause harness (AC-T1.9.2): one group of AMPHORA_RESHARD_PAUSE_ROWS rows split by the planner while clients write — prints each cutover's pause and the longest a write waited on a refusal; passes when every acknowledged write is read back from exactly one group" },
  { id = "T-T1.9.L1", text = "The lab harness (AC-T1.9.3): AMPHORA_RESHARD_OPS automatic operations chosen by the planner from measured rows, writes and cores, carried out while clients write — passes when writes lost is 0 and every key is in exactly one group's file" },
  # lane split-merge-7
  { id = "T-T1.9.R6", text = "A split and a merge back through the shell, the node started again by the directory from before both and the split's Create asked again — passes when the retired group is neither started nor made again but the Create is refused as of an ended operation, and every acknowledged row is in the one group left" },
  { id = "T-T1.9.R7", text = "A local database as a group's engine, its holding fenced through the shell, then the group started again on the same file — passes when the fenced holding is answered after the restart, kept in the file as the Holding command left it" },
  # lane split-merge-8
  { id = "T-T1.9.R8", text = "Copy-path batches on a node with no commit measured, and batches learned from time with large units — passes when no batch holds more units than the process's memory budget takes at the most bytes a unit has held, and at least one" },
  { id = "T-T1.9.R9", text = "A local database holding Records rows made a group's, its keys copied by position in batches into another local database, changed and caught up from its log, then swept — passes when the second answers every key as the first, with the same live count and a head no older than every revision moved, a catch-up from before the log was held is refused, and the sweep leaves the first with no key" },
  # lane split-merge-9
  { id = "T-T1.9.R10", text = "Two nodes, the second of two groups on the first moved to the second by the driver while a row is written before every action, each pull of its copy and catch-up and its answer carried as bytes — passes when the move ends flipped, the first node keeps one group and has retired the moved one, the second holds its span, every key's acknowledged rows read back at its group's node, and every key is in exactly one group's file" },
  { id = "T-T1.9.R11", text = "The move of T-T1.9.R10 with every third pull's answer lost on the way back after the old group's node acted on it, each loss asked again by the driver — passes when some answers were lost and the move still ends flipped with every acknowledged write at its group's node and every key in exactly one group's file" },
  # lane split-merge-10
  { id = "T-T1.9.R12", text = "The move of T-T1.9.R10 with each pull carried over the owner transport between the two nodes' endpoints, every fourth pull asked while the other node's endpoint is down and every third answer dropped after it arrived, each fault asked again by the driver — passes when both faults were met and the move still ends flipped with every acknowledged write at its group's node and every key in exactly one group's file" },
  # lane split-merge-11
  { id = "T-T1.9.R13", text = "Local databases as groups, one split and then merged back by the driver through the shell while a Records transaction is written before every action — passes when each operation is done, every acknowledged write reads back through its group after each, and while split a transaction within one group commits and one whose writes or condition name keys in both groups is refused whole" },
  # lane split-merge-12
  { id = "T-T1.9.R14", text = "A thousand weights added at positions, kept to eight entries — passes when no more than eight are ever kept, their total is exact, the cut leaves weight on each side, and four single weights cut exactly at the middle" },
  { id = "T-T1.9.R15", text = "One group measured by the shell with nothing written, after sixty-four keys are written, and again after — passes when the first has no load cut, the second has load above zero and a cut that counts each key on the side its position falls, the plan on two cores splits the group at that cut, and the third has no load" },
  { id = "T-T1.9.R16", text = "A split and a merge back, then a restart, the groups whose files are found asked of the node before and after — passes when only the retired group is named both times, never the group held nor an id never given out, and once its files are deleted every key still reads back from its group" },
  { id = "T-T1.9.R17", text = "Local databases as groups, one split by the driver, then measured by the shell — passes when each group's size is above zero" },
  # lane split-merge-13
  { id = "T-T1.9.R18", text = "Pulls over a network address under mutual TLS, then a client from another authority, a server from another authority and a server whose certificate names another node, then a database request at the network endpoint, and the LAN harness over two databases' network endpoints — passes when the pulls are answered, each stranger is refused with no pull served, the database request is refused, and the harness commits with no unknown outcome" },
  # lane split-merge-15
  { id = "T-T1.9.R19", text = "A local database made a group's, with one key, then eight, then more keys than one page of its position index holds — passes when it has no size cut with one key, and after that a cut with weight on each side and keys on each side of it, read from the index's root page alone" },
  # lane split-merge-18
  { id = "T-T1.9.R20", text = "Two backed-up groups, the second's clock 500 seconds behind the first's, rows written in turn through their coordinator, then read across groups — passes when the changes come in the order written, in pages of one alike, after a row's stamp the rows after it, the head at or past the last, a scan merged by key with more until its last page, a row written after the head stamped past it, and a group that stamps nothing refused" },
  # lane split-merge-19
  { id = "T-T1.9.R21", text = "One backed-up database, 600 commits each overwriting the next of 8 keys, compacted to the head after every 50 — passes when after each compaction every revision with a kept version is still stamped and the stamps number at most the kept revisions plus one" },
  { id = "T-T1.9.R22", text = "Two backed-up groups, the second's clock 500 seconds behind the first's, a row written in the first, then the changes read at the earliest read point and at the latest — passes when the earliest misses the row with its head behind it, the latest holds it, and after each head the later rows are found and no change at or before it" },
  { id = "T-T1.9.R23", text = "Two groups with revisions 1 to 3 each, stamped 10, 30, 50 and 20, 40, 60, the first's keys moved into the second, then the second's changes read by stamp, and the same keys moved without stamps into a third — passes when each moved row answers its own stamp, the changes interleave by stamp in pages alike, and the third's changes are refused naming the missing stamp" },
  { id = "T-T1.9.R24", text = "Two backed-up groups, the second's clock 500 seconds behind the first's, a row written in each, then each key read across them, a key never written, a key as of before and at its stamp, and what changed after nothing, after the head and after a later write — passes when each row answers its stamp, the unwritten key and the key before its stamp none, the key at its stamp its row, and what changed the newest stamp, then none, then the later write's stamp past the head" },
  { id = "T-T1.9.R25", text = "Two backed-up groups, a row written in the first, a wait across them after the head on its own thread while a row is written in the second, then a wait with a deadline and nothing written — passes when the first wait answers the second row's stamp past the head, as changed does, and the second is refused Timeout" },
  # lane split-merge-20
  { id = "T-T1.9.R26", text = "An old group writing a1, a2 and a1 again at stamps 10, 30, 50, a new one b1, b2, b3 at 20, 22, 24, the old group's keys moved into the new one, which then writes b1 at 70 and a2 at 80, then the new one scanned and read key by key as of 5, 15, 25, 35, 55, 75 and past every stamp, and as of 55 two at a time — passes when each read holds exactly the versions stamped at or before it, a moved row placed by its own stamp and never by its old group's revision number, each row answering its stamp, and the pages alike" },
  { id = "T-T1.9.R27", text = "Under two-phase commit and Parallel Commits, two backed-up groups, rows written and read across them for their stamps, one written again, then commits across both conditioned on a row as of a stamp before its last write, on the stamps reads answered and a key absent, on a key absent that is there and on one present that never was, the same in one group, and a condition on a key-value row — passes when the stale condition aborts on its row with none of the commit's rows written, the held conditions commit, the absent and present ones abort on their keys, one group alike, and the key-value condition is refused" },
  # lane split-merge-21
  { id = "T-T1.9.R28", text = "Two backed-up groups, the second's clock 500 seconds behind, a transaction across them locking a row in each and resolved in the first at the latest stamp the groups answered, then each group read as of that stamp and the second as of the head before the locks, a scan across both as of the stamp begun before the second resolves, and a commit in the second after; and on the simulator's group one transaction resolved at one stamp in two groups — passes when the first group answers its row at the commit stamp, the second's read as of it is held by the lock and as of the earlier head isn't, the scan answers both rows at the one stamp and never one alone, the later commit is stamped after it, and in the simulator both keys carry the one stamp" },
  # lane split-merge-22
  { id = "T-T1.9.R29", text = "Under two-phase commit and Parallel Commits, two backed-up groups, the second's clock 500 seconds behind, through Records::commit across them: a commit writing a row in each, then one conditioned on both rows as of the stamp the first answered and on a key absent, then one on a row as of the stamp before its own — passes when each commit answers one stamp and both its rows read back across groups at it, the conditional one later than the first, and the stale condition is refused as a conflict on its row with neither of its rows written" },
  { id = "T-T1.9.R30", text = "Under two-phase commit and Parallel Commits, three groups in memory, their clocks apart, a transaction writing a key in each with lock replies carrying 30, 50 and 40: the coordinator crashing once the first group resolved it (the explicit commit lost under Parallel Commits) and a new incarnation recovering it; and under Parallel Commits a crash with every lock in place and nothing decided — passes when the client heard committed at 50 and after recovery every key is stamped 50, and in the second case every key carries one stamp, the latest lock stamp" },
  { id = "T-T1.9.R31", text = "Two backed-up groups, two transactions each locking one row of the second, a get across groups of the first row as of the later lock's stamp, then the other transaction resolved, then the first — passes when the get waits, the other row's resolution wakes nothing, and the first row's wakes it once and it answers the row at its commit stamp" },
]

# lane qs5
[[own]]
id = "QT.5"
title = "Hash joins where a seek exists, chosen by cost, with predicate transfer (query-time step 5; with planner rank PL.5 and G6 step 4)"
criteria = [
  { id = "AC-QT.5.1", text = "JOB median best time is at most 147 ms, by bench/planner/record.sh on jupiter, best of 3, each run begun at a load under 2" },
  { id = "AC-QT.5.2", text = "JOB queries at or under 78.4 ms number at least 38, by the same pass" },
  { id = "AC-QT.5.3", text = "TPC-H SF 10 q09 best time is at most 35,000 ms" },
  { id = "AC-QT.5.4", text = "TPC-H SF 10 median best time over the parent's is at most 1.05" },
  { id = "AC-QT.5.5", text = "Every answer unchanged by step 1's whole-answer check; CERT and the order check clean" },
]
tests = [
  { id = "T-QT.5.1", text = "Random joins with NULLs, duplicates, outer, semi and anti joins, run with index nested loops forced and with hash joins forced — passes when identical results" },
  { id = "T-QT.5.2", text = "A build whose input outgrows its estimate tenfold — passes when it spills within its budget with its answer unchanged, and past the spill budget refuses with a typed error naming the budget" },
  { id = "T-QT.5.3", text = "Predicate transfer over a cyclic join graph and over an outer join (transfer in one direction only) — passes when identical results, and the filters' memory within the statement's stated bound" },
  { id = "T-QT.5.4", text = "TPC-H q01 and q06, which join nothing — passes when no filter built, times within the passes' spread of the parent's" },
  { id = "T-QT.5.5", text = "The seek, hash-build, hash-probe and sort weights, learned per database (calibrated at start, moved by operators' times) — passes when calibration alone gives finite positive weights, observed times move a weight to the observed rate, and meaningless observations leave it" },
  # lane qs5-10
  { id = "T-QT.5.6", text = "t_qt_5_5_calibration_weights_hold_through_preempted_samples and t_qt_5_5_a_median_settles_once_its_spread_is_within_the_resolution (crates/engine/translate/optimizer/learned_costs.rs) — passes when calibration with a clock that jumps a millisecond every eleventh reading gives the steady clock's weights, and a kind's samples stop once their median's order-statistic standard error is within the timer's cost" },
  # lane qs5-13
  { id = "T-QT.5.7", text = "t_qt_5_7_hash_entry_bytes_are_the_build_tables_row (crates/engine/translate/optimizer/cost_params.rs) — passes when a hash join's entry bytes are its build table's page over its rows a page plus the entry's fixed bytes, the build's and not the probe's" },
  # lane qs5-15
  { id = "T-QT.5.8", text = "crates/engine/tests/join_methods.rs, nested_loops.rs and hash_semi_join.rs, with the rhs_has_selective_seek gate gone (crates/engine/translate/optimizer/join.rs) — passes when a seek and a hash join are weighed by cost alone and each query answers as with nested loops forced" },
  # lane qs5-18
  { id = "T-QT.5.9", text = "t_qt_5_9_an_is_value_is_null_only_where_planning_knows_it (crates/engine/translate/optimizer/cost_params.rs) and a_one_row_lookup_needs_no_sort_for_its_columns (crates/engine/tests/records_plans.rs), twenty copies at once — passes when an IS is NULL only for the NULL literal and a parameter bound to NULL, not NULL for a non-NULL literal or bound value, unknown otherwise, and every copy plans the (a, b) search with its sort" },
  { id = "T-QT.5.10", text = "t_qt_5_10_each_is_estimate_answers_alike_and_meets_its_failure_mode (crates/engine/tests/is_value_estimate.rs), Connection::set_is_value_estimate's Equality and WorstCase, the generic plan forced, with and without statistics — passes when every answer is the literal query's and, without statistics, Equality takes more cursor steps than WorstCase with NULL bound on a column NULL in 19 rows of 20, and WorstCase more than Equality with distinct values bound; qt_5_10_is_estimate_harness reports both at scale over the concurrency ladder" },
  { id = "T-QT.5.11", text = "t_qt_5_11_* (crates/engine/vdbe/star_order.rs) and t_qt_5_11_star_filters_checked_in_their_measured_order_check_less (crates/engine/tests/star_filters.rs), Connection::set_star_filter_order's Planned and Measured — passes when the filter passing the smallest share moves first, ties keep the planner's order, the order follows a change in the rows, and a star join whose estimates tie answers as the control with fewer filter checks measured than planned" },
  { id = "T-QT.5.12", text = "t_qt_5_3_star_filters_stay_within_the_statements_memory (crates/engine/tests/star_filters.rs) — passes when, with a 200-page cache and three dimensions of 60,000 keys, the star join answers as the control under both orders and its filters' most bytes held, as their builds ended and once sized, are within the statement's memory" },
  # lane qs5-19
  { id = "T-QT.5.13", text = "t_qt_5_11_fading_counts_follow_rows_that_shift_halfway, t_qt_5_11_fading_counts_turn_on_noise_between_close_shares and t_qt_5_11_fading_keeps_the_rows_that_tell_shares_apart (crates/engine/vdbe/star_order.rs), Connection::set_star_filter_order's Measured and MeasuredFading — passes when, after rows that shift halfway, whole counts keep the old order and fading ones turn and check less; on noise between close shares fading turns the order more than ten times as often and checks more; and far-apart shares keep their order on fewer than a tenth of the run's rows" },
  { id = "T-QT.5.14", text = "qt_5_sealing_holds_the_hashes_and_the_filter_within_the_bound (crates/engine/vdbe/bloom_filter.rs) and t_qt_5_3_star_filters_stay_within_the_statements_memory (crates/engine/tests/star_filters.rs) under all three orders — passes when a sized filter's key hashes and finished filter together stay within its bound as it is sealed, one whose hashes fill the bound passes every key, and the star's filters' most bytes held as they are sealed one after another are within the statement's memory" },
  # lane qs5-20
