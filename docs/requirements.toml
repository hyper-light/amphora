# Amphora's own IDs for the planner (kiln plan 01a16eab7f457673b4cf9933adacfc4d, step 7): the ranked
# changes of docs/research/planner.md section 9, each a goal in kiln (PL.1 to PL.13, in rank order)
# whose measurement these name. Each is measured by bench/planner/record.sh on the change and on its
# parent, on one machine, each run begun at a load under 2; step 3's numbers are the baselines.

[[own]]
id = "PL.1"
title = "Join sizes from equivalence classes, with key caps (planner rank 1)"
criteria = [
  { id = "AC-PL.1.1", text = "JOB prefixes estimated below one row while counting 1,000 or more is under 35, against 343 at step 3" },
  { id = "AC-PL.1.2", text = "JOB's median q-error at three joins is under 100 (1.07e+03 at step 3), and its largest intermediate results' p95 under 1e+05 (7.797e+06)" },
  { id = "AC-PL.1.3", text = "JOB's time over the parent's is 0.85 or less by geometric mean, and TPC-H SF 10's median q-error is not above the parent's (9.39 at step 3)" },
]
tests = [
  { id = "T-PL.1.1", text = "A query given join terms its equivalence classes already imply, then one more class-merging term — passes when no added term raises a set's estimate (CERT) and the order check is clean" },
]

[[own]]
id = "PL.2"
title = "Distinct counts and a sample per table, kept by ANALYZE (planner rank 2)"
criteria = [
  { id = "AC-PL.2.1", text = "JOB's first-table q-error p90 is 11 or less (1.342e+04 at step 3), its 15 keyword prefixes within 1.1 of their counts" },
  { id = "AC-PL.2.2", text = "TPC-H SF 10's q16 part is within 10 of its count and q12's lineitem within 100" },
  { id = "AC-PL.2.3", text = "JOB and TPC-H run no slower than the parent beyond its passes' spread, and a statement prepared before ANALYZE plans again after it" },
]
tests = [
  { id = "T-PL.2.1", text = "ANALYZE of a table larger than the sample's bound — passes when its memory stays within the stated bound and the sketch's distinct count is within its stated error" },
]

[[own]]
id = "PL.3"
title = "Connected subsets within a counted budget, the greedy search fixed (planner rank 3)"
criteria = [
  { id = "AC-PL.3.1", text = "SQLite's time over Amphora's on JOB's 9 queries above 12 tables is 1 or more (0.405 at step 3)" },
  { id = "AC-PL.3.2", text = "Every JOB query plans in at most 92.1 ms, the median not above 1.9 ms" },
]
tests = [
  { id = "T-PL.3.1", text = "A join of more tables than the budget allows — passes when planning ends within its budget with a typed result and no panic" },
]

[[own]]
id = "PL.4"
title = "Each table's filters estimated together on its sample (planner rank 4)"
criteria = [
