# lane PG2: PostgreSQL 19's wire core, sans-IO (docs/design/postgres.md, decision 2 and section 11's unit 1;
# crates/amphora/src/postgres/, its check crates/amphora/tests/postgres_protocol.rs).
[[own]]
id = "PG"
title = "PostgreSQL 19 clients and tools work against Amphora as against PostgreSQL 19.0, about 10x faster at every scale"
criteria = [
  { id = "AC-PG.1.1", text = "SCRAM-SHA-256 and SCRAM-SHA-256-PLUS (tls-server-end-point) run as PostgreSQL 19 runs them: RFC 7677's vectors reproduce byte for byte, a verifier reads from PostgreSQL's stored form, each malformed or mismatched message is refused with PostgreSQL's SQLSTATE" },
  { id = "AC-PG.1.2", text = "Start-up at protocol 3.0 and 3.2; a newer minor (3.9999) or a _pq_. option is answered with NegotiateProtocolVersion and the session carries on, never refused; a major other than 3 is refused 0A000" },
  { id = "AC-PG.1.3", text = "The 15 ParameterStatus values PostgreSQL 19 reports (GUC_REPORT), then BackendKeyData with a 4-byte key at 3.0 and 32 bytes at 3.2, then ReadyForQuery I" },
  { id = "AC-PG.1.4", text = "SSLRequest answered S with TLS and N without, GSSENCRequest N, bytes sent before the handshake refused 08P01; direct TLS decided by its first byte and taken only with ALPN postgresql; CancelRequest read with a 1 to 256 byte key and never answered" },
  { id = "AC-PG.1.5", text = "A wrong password and a role that doesn't exist are refused alike: the exchange runs to its end and fails FATAL 28P01" },
  { id = "AC-PG.1.6", text = "A simple Query is answered ErrorResponse 0A000 then ReadyForQuery I (an empty one EmptyQueryResponse); extended-protocol messages get one 0A000 and are skipped to Sync; Terminate ends the session" },
  { id = "AC-PG.1.7", text = "Every parser is bounded: a frame's announced length is checked against PostgreSQL's limit for its type before the caller charges and holds it, and truncated frames, bad lengths, wrong orders and noise get ErrorResponse and never a panic" },
  { id = "AC-PG.3.1", text = "The parser oracle is PostgreSQL 19.0's own raw_parser, unpatched, run as a subprocess: each statement gets 19's tree (nodeToStringWithLocations) or its refusal with SQLSTATE, message and cursor, as a 19.0 server refuses it" },
  { id = "AC-PG.3.2", text = "19's regression SQL is a corpus: each file split into the statements psql 19 sends (its psqlscan.l rules), backslash commands and COPY data left out, and every statement given the oracle's verdict" },
  { id = "AC-PG.4.1", text = "The scanner is flex's tables from 19's scan.l (PostgreSQL's flags, no backing up), generated by a script and driven by flex's matching loop in Rust; every statement of 19's regression SQL scans to the oracle's tokens (pg-oracle --tokens)" },
  { id = "AC-PG.5.1", text = "The grammar is bison 3.8.2's tables from 19's gram.y (PostgreSQL's flags), generated by a script and driven by yacc.c's LR loop in Rust; every statement of 19's regression SQL is accepted or refused as the oracle does, at the same cursor, but those 19 refuses inside gram.y's actions until the actions are ported" },
  { id = "AC-PG.6.1", text = "The generator records each rule's gram.y line and the FNV-1a 64 hash of its action's C text; each Rust action names the hash it was ported from, and a statement that needs an unported or stale action is answered 0A000" },
  { id = "AC-PG.6.2", text = "A parse tree prints as 19's nodeToStringWithLocations prints it, byte for byte, from an arena with no recursion; a statement whose every rule is ported parses to the oracle's tree, and their number in 19's regression SQL (TREES_EQUAL) only rises" },
]
tests = [
  { id = "T-PG.1.1", text = "postgres_protocol::t_pg_1_1_rfc7677_scram_sha_256_vectors, t_pg_1_1_base64_is_rfc4648s_and_strict, t_pg_1_1_scram_sha_256_plus_binds_to_the_certificate — pass when RFC 7677's server-first and server-final messages come out exactly and each refusal carries PostgreSQL's message and SQLSTATE" },
  { id = "T-PG.1.2", text = "postgres_protocol::t_pg_1_2_startup_at_3_0_and_3_2_reports_and_keys_by_version, t_pg_1_2_grease_3_9999_is_negotiated_down_never_refused — pass when 3.9999 with _pq_.test_protocol_negotiation gets NegotiateProtocolVersion 3.2 listing the option and reaches ReadyForQuery, fed whole frames and one byte at a time" },
  { id = "T-PG.1.3", text = "postgres_protocol::t_pg_1_3_parameter_status_is_postgresql_19s_fifteen and session::tests — pass when the reported names are exactly PostgreSQL 19's 15 with its values" },
  { id = "T-PG.1.4", text = "postgres_protocol::t_pg_1_4_ssl_gss_and_direct_tls_are_decided — passes when each opening request gets PostgreSQL's answer or decision" },
  { id = "T-PG.1.5", text = "postgres_protocol::t_pg_1_5_a_wrong_password_and_an_unknown_role_are_refused_28p01" },
  { id = "T-PG.1.6", text = "postgres_protocol::t_pg_1_6_a_query_is_refused_0a000_then_ready — passes when the message sequence is E Z I Z E Z E Z for a query, an empty query, a non-UTF-8 query and an extended batch" },
  { id = "T-PG.1.7", text = "postgres_protocol::t_pg_1_7_hostile_input_to_every_parser, t_pg_1_7_lengths_past_each_limit_are_refused_before_they_are_held — pass when every cut, mutation, length word and noise run at each of the four parsers never panics and every close says why" },
  { id = "T-PG.3.1", text = "amphora-pg-oracle t_pg_3_1_frames_read_back_as_verdicts, t_pg_3_1_malformed_frames_are_refused" },
  { id = "T-PG.3.2", text = "amphora-pg-oracle split::tests::t_pg_3_2_* — pass when semicolons in quotes, parentheses and routine bodies, backslash commands and COPY data split as psql splits them, and hostile scripts end" },
  { id = "T-PG.3.3", text = "amphora-pg-oracle tests/oracle.rs t_pg_3_3_refuses_what_a_19_0_server_refuses_where_it_refuses_it (on demand) — SELECT $1abc is 42601 at 8, NOTIFY ch, $1 is 42601 at 12, as 19.0 answers" },
  { id = "T-PG.3.4", text = "amphora-pg-oracle tests/oracle.rs t_pg_3_4_every_regression_statement_gets_a_verdict (on demand), over vendor/postgres/src/test/regress/sql" },
  { id = "T-PG.4.2", text = "amphora-pg-oracle t_pg_4_2_token_lines_read_back, tests/oracle.rs t_pg_4_2_tokens_are_what_19s_grammar_receives (on demand)" },
  { id = "T-PG.4.1", text = "amphora-pg-parser scan::tests::t_pg_4_1_longest_match_takes_scan_ls_lexemes, t_pg_4_1_every_byte_matches_a_rule_in_initial — pass when the tables' longest match takes scan.l's lexemes and no byte jams the start condition" },
  { id = "T-PG.5.1", text = "amphora-pg-parser gram::tests::t_pg_5_1_* — pass when 19's accepted strings are accepted and answered 0A000, syntax and scanner errors point where 19 points, and nesting past YYMAXDEPTH is refused memory exhausted" },
  { id = "T-PG.5.2", text = "amphora-pg-parser tests/parse_digest.rs t_pg_5_2_grammar_against_the_corpus_digest, tests/parse_oracle.rs t_pg_5_2_grammar_matches_19_on_the_regression_corpus (on demand) — pass when every verdict and cursor is 19's but at most REFUSED_IN_ACTIONS refused in gram.y's actions" },
  { id = "T-PG.6.1", text = "amphora-pg-parser gram::tests::t_pg_6_1_each_ported_action_is_current — passes when every ported action's named hash is gram_tables::ACTION_HASH's for its rule" },
  { id = "T-PG.6.2", text = "amphora-pg-parser tree::tests::t_pg_6_2_* — pass when BEGIN prints as the oracle printed it, and strings escape as outToken escapes them" },
  { id = "T-PG.6.3", text = "amphora-pg-parser gram::tests::t_pg_6_3_begin_and_end_parse_to_19s_trees, tests/parse_digest.rs (corpus.digest's tree hashes), tests/parse_oracle.rs (on demand, the oracle's texts) — pass when every fully ported statement's tree is 19's and at least TREES_EQUAL are" },
  { id = "T-PG.6.4", text = "amphora-pg-parser tests/pgbench.rs::t_pg_6_4_pgbench_statements_parse_to_19s_trees — passes when each statement pgbench sends parses to the oracle's text for it, byte for byte" },
  { id = "T-PG.6.5", text = "amphora-pg-parser tests/startup.rs::t_pg_6_5_driver_startup_statements_parse_to_19s_trees — passes when each statement psql (libpq), pgjdbc, psycopg 3, pgx v5 and node-postgres send as they connect, and SET, RESET and SHOW in their general forms, parse to the oracle's text for it, byte for byte" },
]
