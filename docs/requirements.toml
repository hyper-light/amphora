# lane pitr: CP-T1.12's backups and point-in-time recovery (docs/design/backup.md)
[[own]]
id = "PITR"
title = "Backups and point-in-time recovery to Mantle (G14 step 4)"
# The restore criteria AC-T1.12.3 and AC-T1.12.4 are registered under CP-T1.12.
criteria = []
tests = [
  { id = "T-T1.12.D1", text = "Restore drills at random seconds of a database written, checkpointed, restarted, shipped and copied at random — passes when every row is equal" },
  { id = "T-T1.12.D2", text = "A database opened backed up ships as it commits through its own thread, across a close and a reopen — passes when every second after its first base restores with every row equal and no round failed" },
  { id = "T-T1.12.P1", text = "Commits within a second keep one mark, its last; a new second a new mark" },
  { id = "T-T1.12.P2", text = "A clock that steps back holds stamps at the last, each later than the one before, and is counted" },
  { id = "T-T1.12.P3", text = "Past their bound the two oldest marks merge and their seconds are refused as unknown" },
  { id = "T-T1.12.P4", text = "Archive keys round-trip through their text, in the store's order" },
  { id = "T-T1.12.P5", text = "A second is located in the segment whose marks reach it, or in the quiet stretch before the next segment's first mark; before the first mark, past what is whole, and in an unstamped stretch it is refused" },
  { id = "T-T1.12.P6", text = "The cut is the last mark at or before the second; an unstamped stretch after it is refused" },
  { id = "T-T1.12.P7", text = "The chain takes the latest base on an unbroken log; a gap or a missing tail ends the walk" },
  { id = "T-T1.12.P8", text = "Retention lets go of what precedes the base the oldest kept second needs" },
  { id = "T-T1.12.P9", text = "A base is due with none, after a break, once the log outweighs it, and once a restore at measured rates would pass 30 minutes" },
  { id = "T-T1.12.P10", text = "An archive object round-trips; a changed byte is refused" },
  { id = "T-T1.12.P11", text = "A log started again twice with no write between keeps its link whole; a restart forced before its frames were shipped, or one the fence wasn't told of, breaks it" },
  { id = "T-T1.12.P12", text = "A through mark makes the seconds after the last segment's whole through its time; one that doesn't end at a segment says nothing" },
  { id = "AMPHORA-BLOBS", text = "The Blobs seam's conformance suite (AMPHORA-BLOBS-1 to 7 and 9) passes on SimBlobs" },
  # lane pitr-7
  { id = "AMPHORA-BLOBS-8", text = "The folder store passes AMPHORA-BLOBS-1 to 7 and 9, keeps keys apart under case folding and path names, and answers random operations as SimBlobs does" },
  { id = "T-T1.12.C1", text = "Restore-and-check on a folder passes at the newest whole second against the source's rows and fails naming the rows against rows that differ" },
  { id = "T-T1.12.C2", text = "A check is due at the first, at each new base, and once the log since the last check outweighs what it replayed" },
  { id = "T-T1.12.I1", text = "A second base keeps the first's unchanged chunks and copies the changed; seconds across both restore equal, and after the first expires too" },
  { id = "T-T1.12.I2", text = "Manifests of format 1 still read; format 2's runs give each chunk's base and are refused when they don't add up" },
  { id = "T-T1.12.I3", text = "An incremental base is due once the log since the latest base outweighs what it would copy" },
  { id = "T-T1.12.X1", text = "Two groups restored to every second of two cross-group transactions, under both protocols: both keys or neither at every cut, never moving back" },
  # lane pitr-8
  { id = "T-T1.12.C3", text = "The shipping thread checks its own archive against the source's rows from a snapshot lined up with a second's stamps, and passes" },
  { id = "T-T1.12.X2", text = "Cuts across two groups whose clocks differ by 5 seconds, under both protocols: both keys or neither at every cut, the carried clock taken out failing it" },
  { id = "T-T1.12.I4", text = "A due base waits for the log to start again, unless no base restores the log or its generation holds what a restart keeps" },
  # lane backups-3: continuous restore drills (kiln goal 15580afd; backup.md "Continuous restore drills")
  { id = "T-T1.12.C4", text = "With no scratch path given, the shipping thread checks its archive beside the database by default; the checks pass and leave no file behind" },
  { id = "T-T1.12.C5", text = "A check begins only while the disk holds the restore and the log's growth; under one writer per core, with no checks, unpaced checks and paced checks, no check fails and checks pass once the load ends" },
  { id = "T-T1.12.C6", text = "The drilled seconds are a uniform sample of every quiet snapshot, as many as the memory holds; an expired second is dropped, never picked again" },
  # lane backups-4: paced checks and the drill after a load (kiln goal 15580afd; backup.md "Continuous restore drills")
  { id = "T-T1.12.C7", text = "A paced check's step begins only while the database runs no call, woken by the call that ends last; the database's end stops it" },
  { id = "T-T1.12.D3", text = "After a load from one writer per core, random seconds restore with every row equal to the rows recorded at them" },
  # lane backups-6: a minimum share against yielding fully, event-driven; the peer store (kiln goal 15580afd; backup.md "Continuous restore drills", "The peer store")
  { id = "T-T1.12.C8", text = "Checks wait on events, never timers; under a minimum share (a check's work over the retention period) a check behind it steps with calls in flight; a step costs its bytes at the fastest step of its kind over this check and the last; the replay and the integrity check pause in steps" },
  { id = "T-T1.12.N1", text = "A peer store in another process on the same host: the seam's conformance suite passes through its client, and a database backed up to it restores every row through the client and from the peer's folder" },
  # lane backups-7: a chunk's memory, charged to the budget and planned by the restore (kiln goal 15580afd; backup.md "A chunk's memory")
  { id = "T-T1.12.M1", text = "A file far larger than the memory room is copied in chunks that each fit the copy stream's share of the budget, read and sealed; each chunk is charged while held and given back once put, refused typed while another use holds the room, and the restore is whole" },
  { id = "AMPHORA-BLOBS-9", text = "A ranged get gives an object's bytes from an offset, a length at most, fewer where it ends sooner and none from its end on; a key with no object is refused NotFound: on SimBlobs, the folder store and the peer store" },
  { id = "T-T1.12.M2", text = "A backup made under a large room restores whole under a small one, each chunk fetched in ranged parts that fit the restore's room, one held at a time, its sum checked over the parts; with no room a restore is refused, typed, before anything is written; an altered chunk is refused by its sum" },
  # lane backups-8: a segment's memory, a lost create compared in parts, growing chunks (kiln goal 15580afd; backup.md "A segment's memory", "Growing chunks")
  { id = "T-T1.12.M3", text = "Shipping bounds and charges each part of a segment by half its stream's share, a send without room refused typed before it writes and its commits shipped by the next round; a send carries the marks ready that leave its head room for a frame, the rest sent at once after, so a backlog of marks ships under a small room; a restore and a shipper opening read each segment in ranged parts of half their share, never whole, and a restore under a far smaller room than the segments is whole" },
  { id = "T-T1.12.M4", text = "A create whose object already exists compares it in ranged parts its caller's charge covers, never read whole: the same is no error, a changed, shorter or longer object is refused" },
  { id = "T-T1.12.M5", text = "A/B for a base's chunk size after the room grows: kept, the next base copies only changed chunks and a restore makes a request per chunk; grown (doubled while it fits), the next base copies the whole file and a restore makes fewer requests; both restore whole" },
  # lane backups-9: a retried send's segments (kiln goal 15580afd; backup.md "A retried send")
  { id = "T-T1.12.M6", text = "A send the store refused partway is sent again as it was, its same marks, through and parts, so each object it stored is made again the same; a restore covers overlapping segments once, the furthest-reaching at each first frame, and checks the frames where kept segments overlap agree with the log it wrote, refusing ones that differ" },
]

