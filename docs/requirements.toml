# lane constants
# Picked constants replaced by derived ones (Ada, 2026-11-11: "learned and stat derived values only"; kiln goal
# dfabffcc). FD.n: the process's descriptor budget (local-owner-transport.md, "Decision (lane constants): one
# descriptor budget").

[[own]]
id = "FD.1"
title = "One descriptor budget a process: connections bounded by the system's descriptor limit, not a picked 32"
criteria = [
  { id = "AC-FD.1.1", text = "No count of connections: each accepted connection charges its socket to the process's descriptor budget (the soft RLIMIT_NOFILE as it stands, read at every charge, less the descriptors open outside the budget, counted again when the limit moves, a charge would be refused or the system refuses one; 2^24 handles on Windows), and one past it is closed unserved with a typed refusal at the client" },
  { id = "AC-FD.1.2", text = "The listener's backlog is the system's own most (SOMAXCONN semantics), and the listener goes on when the system refuses a descriptor (EMFILE, ENFILE, WSAEMFILE)" },
  { id = "AC-FD.1.3", text = "A replica's local readers out at once are at most the budget's bound (AC-T1.10.L2)" },
  # lane constants (2026-11-21): OWNERS_MAX's 4,096 replaced
  { id = "AC-FD.1.4", text = "No count of owners: each owner charges one descriptor to the process's budget before any probe or lease (a local or replicated owner's lease, a client's socket), held where that file is held and given back once it closes; past the budget an open or attach is refused TooLarge and makes nothing; the drained paths kept are at most the budget's bound" },
]
tests = [
  { id = "T-FD.1.1", text = "A budget of 3 asked for one, two, then one more — passes when the fourth is refused TooLarge naming what it was for, 4 past 3, and two more are held once two are given back" },
  { id = "T-FD.1.2", text = "The process's budget on Unix, its soft RLIMIT_NOFILE raised by one while it runs and put back — passes when it has room under the limit by stdin, stdout and stderr at least, and its limit follows the raise and the return at its next charge" },
  { id = "T-FD.1.3", text = "A budget of 1, an owner, one client served and kept, a second asked, the first let go, a third asked — passes when the second is turned away before any challenge and the third is served" },
  # lane constants (2026-11-21)
  { id = "T-FD.1.4", text = "A budget of 1, one database opened, a second opened, the first dropped and drained, the second opened again — passes when the first holds 1, the second is refused TooLarge at 1, then served" },
]

[[own]]
id = "DQ.1"
title = "The replicated owner drives once a step, taking turns with its inputs, not a picked 32 drives"
criteria = [
  { id = "AC-DQ.1.1", text = "One drive a step, and a step whose drive left more comes again at once without waiting for an input: deficit round robin of inputs and drives, one unit each (Shreedhar and Varghese 1995, Theorem 4.5)" },
]
tests = [
  { id = "T-DQ.1.1", text = "Three members, an election and 20 writes on driven time — passes when every write is answered and some step left more to drive for the next" },
]

[[own]]
id = "TP.1"
title = "The replicated owner's tick period learned where it runs, not a picked 10 ms"
criteria = [
  { id = "AC-TP.1.1", text = "Each voter's round trips are measured from the owner's own heartbeats', pre-votes' and votes' sends and answers, a request timed only once every earlier one to its peer is answered (Karn's rule), with RFC 9002's smoothed estimator; the log's flushes, the leader's link's arrival lateness and the owner's timer lateness are folded beside them" },
  { id = "AC-TP.1.2", text = "Once an election timeout the period is derived by hyper-timing's law (Ballot, election span, arrival detector, ElectionTiming, TickPace) and the owner ticks, sets its write slot's bounds and its leases at it; before a quorum, the timer and the link are measured it is hyper-timing's start state (TickPace::floor) at the period the owner opened with" },
]
tests = [
  { id = "T-TP.1.1", text = "Requests sent and answered in order, behind unanswered ones, and past the core's count for a lost peer — passes when only an unambiguous request's answer is sampled, at its own round trip" },
  { id = "T-TP.1.2", text = "A pace fed nothing, then a quorum and the timer, then a near and a far group's heartbeats — passes when it is the start state until the link is measured, then covers the measured election, the far group's period longer than the near one's and neither the start period" },
  { id = "T-TP.1.3", text = "The driven election, patience and lease tests — passes when each reads its owner's pace and none assumes 10 ms" },
]

[[own]]
id = "CT.1"
title = "The raft log's compaction due at an expansion learned where it runs, not a picked 128 MiB"
criteria = [
  { id = "AC-CT.1.1", text = "The replicated machine reports its image's bytes, so hyper-durable's compaction_due (Ongaro's thesis §5.1.2) weighs the log against the image it opened with, then the image it last made" },
  { id = "AC-CT.1.2", text = "The owner times each image and each drive that applied entries on its own clock, per byte, with RFC 6298's decaying sums; the expansion is the image's cost over the replay's, raised to a whole factor (ski rental's break-even), one before both are measured; a stall compacts at once" },
]
tests = [
  { id = "T-CT.1.1", text = "Nothing measured, one cost, samples of no time — passes when the factor is one" },
  { id = "T-CT.1.2", text = "Images four times dearer a byte than replay, a third as dear, then dearer — passes when the factor is four, one, then follows the images up" },
  { id = "T-CT.1.3", text = "A large and a tiny sample — passes when each weighs by its bytes" },
  { id = "T-CT.1.4", text = "The driven compaction tests of database::replicated — passes when each compacts by the learned rule" },
]

[[own]]
id = "EN.1"
title = "A replicated command's and an image's envelope is what their encoding adds, not a picked mebibyte"
criteria = [
  { id = "AC-EN.1.1", text = "The bound past a command's or an image's page budget is postcard's most for its baseline prefix and declaration, its base, its page list's length and each page's id and length at the one page size admitted" },
]
tests = [
  { id = "T-EN.1.1", text = "The widest prepared transaction at its whole budget — passes when it encodes within its bound, short only by the list length's unused varint bytes" },
  { id = "T-EN.1.2", text = "The widest image at a lowered budget, and the full budget's arithmetic — passes the same" },
  { id = "T-EN.1.3", text = "Postcard's varint widths and the declaration's — passes when each matches the encoder" },
]

# lane constants-10 (2026-11-21): MB.1, the process memory budget (store.md, "Decision (lane constants): one process
# memory budget"); SB.1, an image bounded by its room for one (replication.md, "Decision (lane constants): an image is
# bounded by the memory budget's room for one").
[[own]]
id = "MB.1"
title = "One process memory budget, learned where it runs and shared out by measured use, not picked bounds"
criteria = [
  { id = "AC-MB.1.1", text = "The limit is the smallest the platform states (Linux: cgroup v2 or v1 limits and MemTotal; macOS: hw.memsize; Windows: GlobalMemoryStatusEx; Unix: soft RLIMIT_AS, RLIMIT_DATA, RLIMIT_RSS), read again at every ask; where none can be read the budget refuses Unavailable naming the platform, with no fallback" },
  { id = "AC-MB.1.2", text = "A use's room is the limit less what the rest of the process holds: the larger of its resident bytes and every charge counted, its own charge given back; a take past it is refused TooLarge naming the use and its room; a charge is given back when it drops" },
]
tests = [
  { id = "T-MB.1.1", text = "A 1 GiB limit, 100 MiB resident, queue then image bytes taken and the queue's dropped: passes when each room is the limit less the rest's hold, a take past it is refused TooLarge at that room, and a dropped charge is given back" },
  { id = "T-MB.1.2", text = "A limit unread, then read, then lowered, then below the resident bytes: passes when unread is Unavailable naming the platform, the room follows the limit, and is zero, never negative" },
  { id = "T-MB.1.3", text = "Resident bytes unread: passes when the charges counted stand for the rest's use" },
  { id = "T-MB.1.4", text = "This process on Linux, macOS and Windows: passes when its limit and resident bytes are both read and the image's room is not refused" },
]

[[own]]
id = "SB.1"
title = "An image is bounded by the memory budget's room for one, not a picked 256 MiB"
criteria = [
  { id = "AC-SB.1.1", text = "Every image made, fitted, installed, captured or received as a baseline, or kept by the reshard directory, is bounded by the memory budget's room for an image read at that moment, no more than its carrier's bound; unread, it is refused Unavailable" },
  { id = "AC-SB.1.2", text = "A replica's database log leaves the image's room free on its filesystem, passed to log_room" },
]
tests = [
  { id = "T-SB.1.1", text = "A machine over a 128 KiB row, its budget fed room to spare, 64 KiB of room, an unread limit, then a 32 KiB carrier: passes when the image fits and a joiner is admitted, then refused TooLarge at 64 KiB, then Unavailable, then refused at 32 KiB" },
  { id = "T-SB.1.2", text = "log_room with the image's room passed: passes when each log has its file and an equal share of what is free past one image" },
]

[[own]]
id = "WK.1"
title = "The replicated owner wakes on its events and its next deadline, not a picked 1 ms poll"
criteria = [
  { id = "AC-WK.1.1", text = "The owner waits on a bell rung by an input queued, a handle dropped, the replication log's write or compaction done (the bell's waker) and a flush done; a ring before the wait is kept" },
  { id = "AC-WK.1.2", text = "An owner with nothing to drive waits at most until its next deadline: its next tick, or sooner a queued or pending submit's, a change's, a hand-off's or the write slot's" },
  { id = "AC-WK.1.3", text = "The owner thread answers a write it waits on the log for, and ends once its last handle is dropped" },
]
tests = [
  { id = "T-WK.1.1", text = "A bell rung, then waited on twice for no time; then waited on for an hour while another thread wakes its waker — passes when the first wait is rung, the second not, the hour's rung" },
  { id = "T-WK.1.2", text = "A lone member of three stepped, then given a submit due a nanosecond past its clock — passes when its deadline is its next tick, then the submit's" },
  { id = "T-WK.1.3", text = "A lone voter on the owner thread, a write submitted until answered, every handle dropped — passes when the write is answered and the owner thread ends" },
]

[[own]]
id = "GN.1"
title = "Windows' generations learned from their own events where they run, and gone-not-slow the detector's verdict: not a picked 3,000-tick generation or 165-tick ceiling"
criteria = [
  { id = "AC-GN.1.1", text = "The quorum patience believes each voter's gap for one to two of that voter's own generations, each as long as its last two gaps past the election timeout were apart; a gap over which the host's detector suspected the voter is refused Suspected, counted and not learned; no ceiling" },
  { id = "AC-GN.1.2", text = "The write slot believes each member's learned gap for one to two of its own generations, each as long as its last two learned gaps were apart" },
]
tests = [
  { id = "T-GN.1.1", text = "Patience: two gaps of 50 ticks 99 apart, then prompt answers; a suspected voter answering 200 late — passes when the second gap is believed 98 ticks on and forgotten 100 later, and the suspected gap refused and not learned" },
  { id = "T-GN.1.2", text = "Slot: a gap of 40 ms after a member's first slot, then none — passes when it is believed at 40 and 79 ms and forgotten at 80 ms" },
]

[[own]]
id = "GN.2"
title = "The log restarts' generation ends once it covers its own spend at the quantile: not a picked 3,000-tick window"
criteria = [
  { id = "AC-GN.2.1", text = "A generation runs from a restart to the restart made once it alone covers its held, its base tail and the next restart's guess strictly below 1 - q of what it applied; the one ended is forgotten; the guess is the worst of the last 1 / (1 - q) holds; no tick or time constant" },
]
tests = [
  { id = "T-GN.2.1", text = "A restart holding 50, then 99,950 and 1 more applied; 1,000 holds of 1 after one of 9 — passes when due at 100,001 and not 100,000, the next at 51,001 and not 51,000, and the guess 9 through the 999th and 1 at the 1,000th" },
]

# lane cc-proto
