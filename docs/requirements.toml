[[own]]
id = "MB.1"
title = "One process memory budget, learned where it runs and shared out by measured use, not picked bounds"
criteria = [
  { id = "AC-MB.1.1", text = "The limit is the smallest the platform states (Linux: cgroup v2 or v1 limits and MemTotal; macOS: hw.memsize; Windows: GlobalMemoryStatusEx; Unix: soft RLIMIT_AS, RLIMIT_DATA, RLIMIT_RSS), read again at every ask; where none can be read the budget refuses Unavailable naming the platform, with no fallback" },
  { id = "AC-MB.1.2", text = "A use's room is the limit less what the rest of the process holds: the larger of its resident bytes and every charge counted, its own charge given back; a take past it is refused TooLarge naming the use and its room; a charge is given back when it drops" },
]
tests = [
  { id = "T-MB.1.1", text = "A 1 GiB limit, 100 MiB resident, queue then image bytes taken and the queue's dropped: passes when each room is the limit less the rest's hold, a take past it is refused TooLarge at that room, and a dropped charge is given back" },
  { id = "T-MB.1.2", text = "A limit unread, then read, then lowered, then below the resident bytes: passes when unread is Unavailable naming the platform, the room follows the limit, and is zero, never negative" },
  { id = "T-MB.1.3", text = "Resident bytes unread: passes when the charges counted stand for the rest's use" },
  { id = "T-MB.1.4", text = "This process on Linux, macOS and Windows: passes when its limit and resident bytes are both read and the image's room is not refused" },
]

[[own]]
id = "SB.1"
title = "An image is bounded by the memory budget's room for one, not a picked 256 MiB"
criteria = [
  { id = "AC-SB.1.1", text = "Every image made, fitted, installed, captured or received as a baseline, or kept by the reshard directory, is bounded by the memory budget's room for an image read at that moment, no more than its carrier's bound; unread, it is refused Unavailable" },
  { id = "AC-SB.1.2", text = "A replica's database log leaves the image's room free on its filesystem, passed to log_room" },
]
tests = [
  { id = "T-SB.1.1", text = "A machine over a 128 KiB row, its budget fed room to spare, 64 KiB of room, an unread limit, then a 32 KiB carrier: passes when the image fits and a joiner is admitted, then refused TooLarge at 64 KiB, then Unavailable, then refused at 32 KiB" },
  { id = "T-SB.1.2", text = "log_room with the image's room passed: passes when each log has its file and an equal share of what is free past one image" },
]

[[own]]
id = "WK.1"
title = "The replicated owner wakes on its events and its next deadline, not a picked 1 ms poll"
criteria = [
  { id = "AC-WK.1.1", text = "The owner waits on a bell rung by an input queued, a handle dropped, the replication log's write or compaction done (the bell's waker) and a flush done; a ring before the wait is kept" },
  { id = "AC-WK.1.2", text = "An owner with nothing to drive waits at most until its next deadline: its next tick, or sooner a queued or pending submit's, a change's, a hand-off's or the write slot's" },
  { id = "AC-WK.1.3", text = "The owner thread answers a write it waits on the log for, and ends once its last handle is dropped" },
]
tests = [
  { id = "T-WK.1.1", text = "A bell rung, then waited on twice for no time; then waited on for an hour while another thread wakes its waker — passes when the first wait is rung, the second not, the hour's rung" },
  { id = "T-WK.1.2", text = "A lone member of three stepped, then given a submit due a nanosecond past its clock — passes when its deadline is its next tick, then the submit's" },
  { id = "T-WK.1.3", text = "A lone voter on the owner thread, a write submitted until answered, every handle dropped — passes when the write is answered and the owner thread ends" },
]

[[own]]
id = "GN.1"
title = "Windows' generations learned from their own events where they run, and gone-not-slow the detector's verdict: not a picked 3,000-tick generation or 165-tick ceiling"
criteria = [
  { id = "AC-GN.1.1", text = "The quorum patience believes each voter's gap for one to two of that voter's own generations, each as long as its last two gaps past the election timeout were apart; a gap over which the host's detector suspected the voter is refused Suspected, counted and not learned; no ceiling" },
  { id = "AC-GN.1.2", text = "The write slot believes each member's learned gap for one to two of its own generations, each as long as its last two learned gaps were apart" },
]
tests = [
  { id = "T-GN.1.1", text = "Patience: two gaps of 50 ticks 99 apart, then prompt answers; a suspected voter answering 200 late — passes when the second gap is believed 98 ticks on and forgotten 100 later, and the suspected gap refused and not learned" },
  { id = "T-GN.1.2", text = "Slot: a gap of 40 ms after a member's first slot, then none — passes when it is believed at 40 and 79 ms and forgotten at 80 ms" },
]

[[own]]
id = "GN.2"
title = "The log restarts' generation ends once it covers its own spend at the quantile: not a picked 3,000-tick window"
criteria = [
  { id = "AC-GN.2.1", text = "A generation runs from a restart to the restart made once it alone covers its held, its base tail and the next restart's guess strictly below 1 - q of what it applied; the one ended is forgotten; the guess is the worst of the last 1 / (1 - q) holds; no tick or time constant" },
]
tests = [
  { id = "T-GN.2.1", text = "A restart holding 50, then 99,950 and 1 more applied; 1,000 holds of 1 after one of 9 — passes when due at 100,001 and not 100,000, the next at 51,001 and not 51,000, and the guess 9 through the 999th and 1 at the 1,000th" },
]

# lane cc-proto
