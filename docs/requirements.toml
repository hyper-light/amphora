  { id = "T-PL.13.5", text = "A hash join's build filtered by its own terms counts the share of its table they keep against the share the plan's sample gave; past its error the counted share is stored for the planner and every statement planned on the old one is planned again, once; the answer is the same with adaptive joins on and off" },
  # lane replan-6
  { id = "T-PL.13.7", text = "An uncorrelated FROM-clause subquery's stored result counts its rows once filled, against the rows the plan read for it, keyed by the subquery's identity; past the estimate's error the count is stored for the planner and the statement is planned again, once; the answer is the same with adaptive joins on and off, for a CTE referenced twice and a GROUP BY subquery" },
