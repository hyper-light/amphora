  { id = "AC-SH.1", text = "amphora-bench --scale drives all three through the same closed-loop writers and timing, each over the network by its own wire client (Amphora's client protocol, Postgres wire, MySQL wire), each system's own processes on the same machines, OS, disk and filesystem (native by default; containers for all or none)" },
  { id = "AC-SH.2", text = "Every scale record says which client and platform produced it: host, OS, kernel, arch, how the system ran, its wire client and the binaries' folder" },
  { id = "AC-SH.3", text = "Every system over the network is sent the same work the same way: each write, read and transaction one SQL statement as text with its values as literals, one round trip, committed on its own (Amphora's client protocol takes text only, so Postgres's simple query protocol and MySQL's text protocol for the others); each record says so" },
  # lane scaleout-harness-9
  { id = "AC-SH.4", text = "Every system's client gives a request up after --deadline-s: Amphora's client by its deadline, TiDB's MySQL client and the bench's Postgres client by their sockets' read and write timeouts (the give-up only, never a wake); each record says how, how the system routes a write (forwarded by the node it was sent to, or straight to the leader), and that no system over a wire is given prepared statements" },
  { id = "AC-SH.5", text = "The in-process relay waits on one wake across its group's members (each replica's listener, rung for an outgoing record or the owner's end) and on held records' due times, never a spin" },
  # lane scaleout-harness-10
  { id = "AC-SH.6", text = "The read measures' warm-up is one read of the last preloaded row, never asked again: it waits on the write by the system's own control where there is one (Amphora's session token from the write's answer), else it is one read at the system's strongest consistency (CockroachDB's leaseholder, TiDB's ReadIndex follower read); each record says what each system's warm-up did" },
  { id = "AC-SH.7", text = "regionloss's time to serve again is one count a writer on the region's own copy, each waiting on that writer's last acknowledged write by the system's own control, never a poll; a system with no such read has the figure refused, typed and said why, and the rest of the measure stands; --poll-us isn't taken" },
  { id = "AC-SH.8", text = "Schema setup asks each node in the configured order, from node 0, the next only once the one before failed, and gives up at --deadline-s or once every node failed, naming each failure" },
  { id = "AC-SH.9", text = "In-process, a write or read that finds no live member naming a live leader (none elected yet, or the one named cut off, as after regionloss's kill) waits on a live member for the leader change (ReplicaHandle::wait_leader, a leader of a later term), up to --deadline-s, never a retry" },
  { id = "AC-SH.10", text = "regionloss's and cutover's phases (--settle-s, --after-s) last their length, a condition variable's wait for a duration that a spurious wake can't cut short, or end as soon as a worker fails, woken by that failure" },
  # lane scaleout-harness-11
  { id = "AC-SH.11", text = "TiDB's waits on PD's background work (the region measure's placement, cutover's leader and replica moves) read PD's state every schedule.patrol-region-interval, PD's own period for checking each Region against its rules, read from the cluster by SHOW CONFIG (PD offers no watch or long-poll for Region or placement changes); --poll-us isn't taken by any scale measure; each such record's waits says what was read, how often, and that the period is PD's" },
]
