  { id = "AC-T1.13.1", text = "Usable now: production kiln runs on distributed Amphora with its numbers published, and Amphora installs on its own" },
  { id = "AC-T1.13.2", text = "durable writes per second across 3 machines is at least 12140, measured by Amphora's bench, 10x K0's Vitess 1,214" },
  { id = "AC-T1.13.3", text = "write p99 at that load is at most 25 ms, measured by Amphora's bench, a third of K0's Vitess 74 ms" },
  { id = "AC-T1.13.4", text = "history-read p99 is at most 6.5 ms, measured by Amphora's bench, K0's Vitess p99" },
