  { id = "T-T1.10.C2", text = "A follower read asked past its replica's closed time, then a write — passes when it is answered once the write applies, at a time at least the one asked, with the write; and one asked an hour ahead is refused Timeout at its deadline" },
  { id = "T-T1.10.S1", text = "Partitions' answers merged — passes when the merge equals the sorted union cut to the limit over 500 random shapes, and every partition is asked while every other is (each ask waits for all to begin)" },
]

