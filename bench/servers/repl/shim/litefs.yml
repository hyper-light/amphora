# LiteFS on each node of servers/repl/litefs.sh: every node a candidate for Consul's lease (LiteFS's
# lease for failover), the shim run once the node is primary or follows one. TTL and lock delay are
# LiteFS's own defaults (its docs' `lease.consul` section), left unset here.
fuse:
  dir: "/litefs"
data:
  dir: "/var/lib/litefs"
lease:
  type: "consul"
  hostname: "${LITEFS_HOSTNAME}"
  advertise-url: "http://${LITEFS_HOSTNAME}:20202"
  candidate: true
  consul:
    url: "${LITEFS_CONSUL}"
    key: "litefs/bench"
exec:
  - cmd: "shim -backend sqlite -path /litefs/bench.db -listen :8080"
