# What Amphora vendors, each project at one revision (kiln's docs/vendoring.md). scripts/vendor.py
# reads it; kiln, vendoring Amphora, holds every project named here at the same revision.
format = 1

# Amphora's gate, run after a re-vendor.
gate = ["bash scripts/gates.sh"]

# Consensus, its durable shell and device log, pinned to the revision Kiln consumes.
[projects.hyper-raft]
kind = "git"
repository = "https://github.com/hyper-light/hyper-raft"
commit = "7d1c7be3ca3f9e63eb03d54881e21fb2e60989f4"
path = "vendor/hyper-raft"
take = [
  "Cargo.toml",
  "LICENSE",
  "crates/hyper-block",
  "crates/hyper-datagram",
  "crates/hyper-durable",
  "crates/hyper-liveness",
  "crates/hyper-log",
  "crates/hyper-measure",
  "crates/hyper-quic",
  "crates/hyper-raft",
  "crates/hyper-rt",
  "crates/hyper-rt-transport",
  "crates/hyper-seal",
  "crates/hyper-sim",
  "crates/hyper-timing",
  "crates/hyper-tls",
  "crates/hyper-transport",
]
own = ["UPSTREAM.md"]

# PostgreSQL 19.0's parser sources and its regression SQL (docs/design/postgres.md section 3): the
# grammar and scanner the Rust parser's tables are generated from, the node definitions its actions
# build, the SQLSTATEs its refusals carry, and the corpus its checks run against the oracle.
[projects.postgres]
kind = "git"
repository = "https://github.com/postgres/postgres"
commit = "5c839a2a08b9b87a349be97371fac6c5a2873b10"
path = "vendor/postgres"
take = [
  "COPYRIGHT",
  "src/backend/parser/gram.y",
  "src/backend/parser/parser.c",
  "src/backend/parser/scan.l",
  "src/backend/parser/scansup.c",
  "src/backend/utils/errcodes.txt",
  "src/include/nodes/parsenodes.h",
  "src/include/nodes/primnodes.h",
  "src/include/parser/kwlist.h",
  "src/test/regress/sql",
]
own = ["UPSTREAM.md"]
