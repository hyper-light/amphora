# What is left in the engine's production code (crates/engine*) that breaks CLAUDE.md §1, lint by
# lint, as scripts/check-production.sh counts it, for each host the gate runs on (what is compiled
# differs by platform): each line may only fall, and is lowered as it does. Counted 2026-10-20, when
# the engine became Amphora's own (Rust 1.99.1); recounted 2026-11-24, when the gate began counting
# the engine as the shipped binary builds it.
[left.x86_64-unknown-linux-gnu]
"clippy::panic" = 195
"clippy::unwrap_used" = 432
"clippy::expect_used" = 849
"clippy::unreachable" = 457
"clippy::todo" = 11
"clippy::unimplemented" = 0
"clippy::indexing_slicing" = 3040
"clippy::arithmetic_side_effects" = 3273
"clippy::string_slice" = 101
"clippy::cast_possible_truncation" = 519
"clippy::cast_sign_loss" = 233
"clippy::cast_possible_wrap" = 672
"clippy::disallowed_macros" = 755
"clippy::disallowed_methods" = 40
"clippy::disallowed_types" = 0
"clippy::dbg_macro" = 0
"clippy::exit" = 0
