[package]
name = "amphora"
description = "Amphora: the database kiln keeps every record in: KilnDB made a product"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "amphora"
path = "src/main.rs"

[dependencies]
anyhow = "1"
tracing = "0.1"
# The engine a store runs on: Turso, vendored (vendor/turso/UPSTREAM.md), pure Rust (no simd, no C
# crypto, no fts: nothing compiled from C).
turso_core = { path = "../../vendor/turso/core", default-features = false, features = ["fs", "json", "pure-rust-crypto"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
