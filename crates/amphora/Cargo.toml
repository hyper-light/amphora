[package]
name = "amphora"
description = "Amphora: the database kiln keeps every record in: KilnDB made a product"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "amphora"
path = "src/main.rs"

[dependencies]
anyhow = "1"
tracing = "0.1"
# The engine a store runs on (crates/engine: what Turso was at 3e09a82, Amphora's own since), pure
# Rust (no simd, no C crypto, no fts: nothing compiled from C), each page of a new database
# checksummed (XXH3), checked on every read (docs/design/store.md, decision 12).
amphora-engine = { path = "../engine", default-features = false, features = ["fs", "json", "pure-rust-crypto", "checksum"] }

[target.'cfg(target_os = "linux")'.dependencies]
# A new database's files written in place on btrfs (its no-copy-on-write flag; decision 12).
rustix = { version = "1.1", features = ["fs"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
